# ComfyUI extra model roots for the PodBooth MiniMax H3 serverless worker.
# Network volume is mounted at /runpod-volume on RunPod Serverless (not /workspace).
# H3 and Wan can share one volume: keep /runpod-volume/loras/ as the Wan booth already uses it.

comfyui:
    base_path: /ComfyUI/
    is_default: true
    checkpoints: models/checkpoints/
    clip: models/clip/
    clip_vision: models/clip_vision/
    configs: models/configs/
    controlnet: models/controlnet/
    diffusion_models: |
        models/diffusion_models
        models/unet
        /tmp/h3-cache-current/diffusion_models
        /runpod-volume/models/diffusion_models
        /runpod-volume/models/
    text_encoders: |
        models/text_encoders
        /tmp/h3-cache-current/text_encoders
        /runpod-volume/models/text_encoders
    loras: |
        models/loras/
        /tmp/h3-cache-current/loras/
        /runpod-volume/loras/
        /runpod-volume/models/loras/
    vae: |
        models/vae
        /tmp/h3-cache-current/vae
        /runpod-volume/models/vae
    audio_encoders: |
        models/audio_encoders
        /runpod-volume/models/audio_encoders
    embeddings: |
        models/embeddings
        /runpod-volume/models/embeddings
