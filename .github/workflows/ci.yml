name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: h3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Validate repository contracts
        run: |
          python -m json.tool .runpod/hub.json >/dev/null
          python -m json.tool .runpod/tests.json >/dev/null
          python -m json.tool models.json >/dev/null
          python -m json.tool workflows/h3_i2v_api.json >/dev/null
          bash -n entrypoint.sh scripts/provision-volume.sh scripts/publish-cached-model.sh
          pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish lightweight worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/yt-gang/h3-video-runpod:latest
            ghcr.io/yt-gang/h3-video-runpod:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
